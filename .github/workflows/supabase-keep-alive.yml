name: Supabase Keep-Alive

# 無料枠の Supabase プロジェクトは「1週間 無活動」で自動的に一時停止される。
# 定期的に軽量な DB クエリを投げて「活動中」を維持し、自動停止を防ぐ。
# 参考: https://supabase.com/docs/guides/platform/billing-on-supabase
#
# 必要な GitHub Secrets（deploy-production.yml と共用）:
#   - SUPABASE_URL
#   - SUPABASE_SERVICE_KEY  ※ RLS をバイパスするため確実に DB に到達する

on:
  schedule:
    # 毎日 03:17 UTC に実行。
    # - 毎時 0 分は GitHub 側が混雑し遅延・スキップしやすいため分をずらす。
    # - 「毎日」にすることで、数回スキップされても 7 日の停止猶予を確実に下回る。
    - cron: "17 3 * * *"
  workflow_dispatch: {} # 手動実行も可能

# 重複起動しても無駄打ちしないよう同時実行を抑制
concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lightweight DB read to register activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_KEY secret が未設定です。リポジトリの Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi

          # service_role キーは RLS をバイパスするため、1 行 SELECT で確実に DB に触れる。
          # 応答ボディは出力しない（id 漏洩防止）。HTTP ステータスのみで判定する。
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/user_data?select=id&limit=1")

          echo "HTTP ${status}"
          if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
            echo "✅ Supabase は応答しています（活動を記録しました）。"
          else
            echo "::error::Supabase への ping が失敗しました (HTTP ${status})。プロジェクトが既に停止しているか、認証情報を確認してください。"
            exit 1
          fi
